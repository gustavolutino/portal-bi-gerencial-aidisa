<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ficha de producto · Portal BI Gerencial</title>
  <style>:root{--navy:#08283f;--cyan:#00a7b5;--ink:#0b1d2c;--slate:#597080;--canvas:#f3f6f8;--line:#d9e3e8;--amber:#a46b10;--amber-bg:#fff1d5}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.bar{background:var(--navy);color:#fff;padding:16px max(20px,calc((100% - 1200px)/2));display:flex;justify-content:space-between;gap:18px;align-items:center}.bar strong{font-size:14px;letter-spacing:.03em}.back{color:#dff4f6;text-decoration:none;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:42px 24px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:750;color:#527082}.hero{background:#fff;border:1px solid var(--line);padding:30px;margin-bottom:14px}.hero h1{font-size:clamp(34px,5vw,58px);letter-spacing:-.055em;line-height:1;margin:11px 0}.hero p{color:var(--slate);line-height:1.55;max-width:720px}.badge{display:inline-block;font-size:12px;padding:5px 8px;background:var(--amber-bg);color:var(--amber)}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.fact,.panel{background:#fff;border:1px solid var(--line);padding:20px}.fact span{font-size:12px;color:var(--slate)}.fact b{display:block;margin-top:7px;font-size:15px;line-height:1.4}.panel{margin-top:14px}.panel h2{font-size:18px;margin:0 0 9px}.panel p{color:var(--slate);line-height:1.55;margin:0}.notice{margin-top:14px;background:#e7f5f6;border-left:4px solid var(--cyan);padding:18px;color:#254c5e;line-height:1.55}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.button{display:inline-block;background:var(--navy);color:#fff;padding:10px 13px;text-decoration:none;font-size:13px;font-weight:700}.button.alt{background:#fff;border:1px solid var(--navy);color:var(--navy)}@media(max-width:700px){.facts{grid-template-columns:1fr}.wrap{padding:28px 18px}.hero{padding:23px}}</style>
</head>
<body>
  <header class="bar"><strong>PORTAL BI GERENCIAL</strong><a class="back" href="index.html">← Volver a productos</a></header>
  <main class="wrap" id="app"><div class="hero"><div class="eyebrow">Cargando ficha de producto…</div></div></main>
  <script>
    const id=new URLSearchParams(location.search).get('id'),app=document.getElementById('app');fetch('catalogo.json').then(r=>r.json()).then(data=>{const p=data.productos.find(x=>x.id===id);if(!p)throw new Error('Producto no encontrado');document.title=`${p.nombre} · Portal BI Gerencial`;const actions=p.dashboard?`<div class="actions"><a class="button" href="${p.dashboard.gerencia_general}">Abrir Gerencia General</a><a class="button alt" href="${p.dashboard.divisiones}">Seguimiento de divisiones</a></div>`:'';app.innerHTML=`<section class="hero"><div class="eyebrow">Producto ${String(p.orden).padStart(2,'0')} · ${p.categoria}</div><h1>${p.nombre}</h1><span class="badge">${p.estado}</span><p>${p.descripcion}</p>${actions}</section><section class="facts"><article class="fact"><span>Valor BI</span><b>${p.valor_bi}</b></article><article class="fact"><span>Responsable</span><b>${p.responsable}</b></article><article class="fact"><span>Frecuencia prevista</span><b>${p.frecuencia}</b></article></section><section class="panel"><h2>Alcance gerencial</h2><p>${p.alcance}</p></section><section class="panel"><h2>Vigencia y versión</h2><p>Corte: <strong>${p.corte}</strong><br>Versión: <strong>${p.version}</strong></p></section><section class="notice"><strong>Siguiente hito:</strong> ${p.siguiente_hito}<br><br>${p.dashboard?'Esta versión HTML estática es la vigente para la consulta gerencial.':'Cuando exista una versión publicada, esta ficha mostrará el acceso al dashboard HTML vigente, sin reemplazar la identidad ni el contexto del producto.'}</section>`;}).catch(()=>app.innerHTML='<section class="hero"><h1>Producto no encontrado</h1><p>Vuelve al catálogo para seleccionar un producto disponible.</p></section>');
  </script>
</body>
</html>
